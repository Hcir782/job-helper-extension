<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>求职简历助手</title>
</head>
<body>
  <main class="panel">
    <header class="panel-header">
      <h1>求职简历助手</h1>
      <span class="version" id="version">v0.8.0</span>
    </header>

    <div class="fatal-box" id="fatal-box"></div>

    <!-- 简历版本工具栏：切换 / 新建 / 复制 / 删除 -->
    <div class="version-bar">
      <select id="resume-select" class="version-select" title="切换简历版本"></select>
      <button id="btn-new-resume" class="mini-btn" type="button" title="新建简历版本">＋</button>
      <button id="btn-dup-resume" class="mini-btn" type="button" title="把当前版本复制为一个新版本">⧉</button>
      <button id="btn-del-resume" class="mini-btn danger" type="button" title="删除当前版本">✕</button>
    </div>

    <!-- ========== 从简历文件导入（v0.11.0：PDF → 结构化 JSON） ========== -->
    <details class="group import-group" id="import-group">
      <summary class="divider">从简历文件导入（PDF）</summary>

      <p class="import-hint">
        选一份简历 PDF，本地抽出文字后交给大模型映射成 44 项字段。
        <strong>PDF 本身不上传</strong>，只有抽出的文字会发给下面配置的模型服务。
      </p>

      <!-- 第一步：模型配置 -->
      <div class="llm-config">
        <label class="field field-wide">
          <span class="field-label">模型服务地址</span>
          <input type="text" id="llm-baseurl" placeholder="https://api.deepseek.com/v1" />
        </label>
        <label class="field field-wide">
          <span class="field-label">模型名</span>
          <input type="text" id="llm-model" placeholder="deepseek-chat" />
        </label>
        <label class="field field-wide">
          <span class="field-label">API Key</span>
          <input type="password" id="llm-key" placeholder="sk-..." autocomplete="off" />
        </label>
        <div class="llm-config-foot">
          <label class="check-inline">
            <input type="checkbox" id="llm-key-session" />
            <span>只记住本次会话（关掉浏览器就清空）</span>
          </label>
          <button id="btn-llm-test" class="link-btn" type="button">测试连接</button>
        </div>
        <p class="llm-config-tip" id="llm-test-tip"></p>
      </div>

      <!-- 第二步：选文件 -->
      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept="application/pdf,.pdf" hidden />
        <p class="drop-title">把简历 PDF 拖到这里</p>
        <p class="drop-sub">或 <button id="btn-pick-file" class="link-btn" type="button">点击选择文件</button>（单份 ≤ 8 MB）</p>
      </div>

      <p class="import-status" id="import-status"></p>

      <!-- 第三步：抽取结果 -->
      <div class="import-result" id="import-result"></div>

      <div class="import-actions" id="import-actions" hidden>
        <button id="btn-import-apply" class="btn btn-primary" type="button">导入为新简历版本</button>
        <button id="btn-import-cancel" class="btn btn-ghost" type="button">放弃</button>
      </div>
    </details>

    <form id="resume-form" class="form" autocomplete="off">
      <!-- ========== 基本信息（13） ========== -->
      <details class="group" open>
        <summary class="divider">基本信息</summary>

        <div class="row">
          <label class="field">
            <span class="field-label">姓名</span>
            <input type="text" name="name" />
          </label>
          <label class="field">
            <span class="field-label">性别</span>
            <select name="gender">
              <option value="">请选择</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </label>
        </div>

        <div class="row">
          <label class="field">
            <span class="field-label">出生日期</span>
            <input type="text" name="birth" />
          </label>
          <label class="field">
            <span class="field-label">手机号</span>
            <input type="tel" name="phone" />
          </label>
        </div>

        <div class="row">
          <label class="field">
            <span class="field-label">邮箱</span>
            <input type="email" name="email" />
          </label>
          <label class="field">
            <span class="field-label">证件类型</span>
            <select name="idType">
              <option value="">请选择</option>
              <option value="身份证">身份证</option>
              <option value="护照">护照</option>
              <option value="港澳通行证">港澳通行证</option>
              <option value="台湾通行证">台湾通行证</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span class="field-label">证件号码</span>
          <input type="text" name="idCard" />
        </label>

        <div class="row">
          <label class="field">
            <span class="field-label">国籍</span>
            <input type="text" name="nationality" />
          </label>
          <label class="field">
            <span class="field-label">民族</span>
            <input type="text" name="nation" />
          </label>
        </div>

        <label class="field">
          <span class="field-label">政治面貌</span>
          <select name="politics">
            <option value="">请选择</option>
            <option value="群众">群众</option>
            <option value="共青团员">共青团员</option>
            <option value="中共预备党员">中共预备党员</option>
            <option value="中共党员">中共党员</option>
            <option value="民主党派">民主党派</option>
            <option value="其他">其他</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">现居住地 / 通讯地址</span>
          <input type="text" name="address" />
        </label>

        <div class="row">
          <label class="field">
            <span class="field-label">紧急联系人</span>
            <input type="text" name="emergencyContact" />
          </label>
          <label class="field">
            <span class="field-label">紧急联系人电话</span>
            <input type="tel" name="emergencyPhone" />
          </label>
        </div>
      </details>

      <!-- ========== 教育背景（7） ========== -->
      <details class="group" open>
        <summary class="divider">教育背景</summary>

        <div class="row">
          <label class="field">
            <span class="field-label">最高学历</span>
            <select name="education">
              <option value="">请选择</option>
              <option value="大专">大专</option>
              <option value="本科">本科</option>
              <option value="硕士">硕士</option>
              <option value="博士">博士</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">毕业时间</span>
            <input type="text" name="graduationYear" />
          </label>
        </div>

        <div class="row">
          <label class="field">
            <span class="field-label">学校名称</span>
            <input type="text" name="school" />
          </label>
          <label class="field">
            <span class="field-label">学院名称</span>
            <input type="text" name="college" />
          </label>
        </div>

        <div class="row">
          <label class="field">
            <span class="field-label">专业</span>
            <input type="text" name="major" />
          </label>
          <label class="field">
            <span class="field-label">学习形式</span>
            <select name="studyMode">
              <option value="">请选择</option>
              <option value="全日制">全日制</option>
              <option value="非全日制">非全日制</option>
            </select>
          </label>
        </div>

        <div class="row">
          <label class="field">
            <span class="field-label">成绩排名 / 绩点</span>
            <input type="text" name="gpaRank" />
          </label>
          <label class="field">
            <span class="field-label">是否境外留学</span>
            <select name="isOverseas">
              <option value="">请选择</option>
              <option value="否">否</option>
              <option value="是">是</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span class="field-label">教育经历明细（起止时间 / 主修课程等）</span>
          <textarea name="eduDetail" rows="3"></textarea>
        </label>

        <label class="field">
          <span class="field-label">高中经历（学校 / 起止时间）</span>
          <input type="text" name="highSchool" />
        </label>
      </details>

      <!-- ========== 求职意向（7） ========== -->
      <details class="group">
        <summary class="divider">求职意向</summary>

        <div class="row">
          <label class="field">
            <span class="field-label">期望职位</span>
            <input type="text" name="expectPosition" />
          </label>
          <label class="field">
            <span class="field-label">意向城市</span>
            <input type="text" name="expectCity" />
          </label>
        </div>

        <div class="row">
          <label class="field">
            <span class="field-label">期望薪资</span>
            <input type="text" name="expectSalary" />
          </label>
          <label class="field">
            <span class="field-label">工作年限</span>
            <select name="workYears">
              <option value="">请选择</option>
              <option value="应届生">应届生</option>
              <option value="1年以内">1年以内</option>
              <option value="1-3年">1-3年</option>
              <option value="3-5年">3-5年</option>
              <option value="5年以上">5年以上</option>
            </select>
          </label>
        </div>

        <div class="row">
          <label class="field">
            <span class="field-label">是否接受城市调剂</span>
            <select name="acceptRelocate">
              <option value="">请选择</option>
              <option value="是">是</option>
              <option value="否">否</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">是否可实习</span>
            <select name="availableIntern">
              <option value="">请选择</option>
              <option value="是">是</option>
              <option value="否">否</option>
            </select>
          </label>
        </div>

        <div class="row">
          <label class="field">
            <span class="field-label">了解渠道</span>
            <input type="text" name="sourceChannel" />
          </label>
          <label class="field">
            <span class="field-label">推荐码 / 内推码</span>
            <input type="text" name="referrerCode" />
          </label>
        </div>
      </details>

      <!-- ========== 经历与能力（9） ========== -->
      <details class="group">
        <summary class="divider">经历与能力</summary>

        <label class="field">
          <span class="field-label">实习经历（公司 / 职位 / 时间 / 职责与产出）</span>
          <textarea name="internshipExp" rows="3"></textarea>
        </label>

        <label class="field">
          <span class="field-label">项目经历</span>
          <textarea name="projectExp" rows="3"></textarea>
        </label>

        <label class="field">
          <span class="field-label">在校职务</span>
          <textarea name="campusExp" rows="2"></textarea>
        </label>

        <label class="field">
          <span class="field-label">获奖 / 竞赛</span>
          <textarea name="awards" rows="2"></textarea>
        </label>

        <label class="field">
          <span class="field-label">证书 / 资格</span>
          <textarea name="certificates" rows="2"></textarea>
        </label>

        <div class="row">
          <label class="field">
            <span class="field-label">语言能力</span>
            <input type="text" name="languageLevel" />
          </label>
          <label class="field">
            <span class="field-label">作品链接</span>
            <input type="text" name="portfolio" />
          </label>
        </div>

        <label class="field">
          <span class="field-label">技能</span>
          <textarea name="skills" rows="2"></textarea>
        </label>

        <label class="field">
          <span class="field-label">论文 / 学术成果</span>
          <textarea name="papers" rows="2"></textarea>
        </label>
      </details>

      <!-- ========== 工作与补充（4） ========== -->
      <details class="group">
        <summary class="divider">工作与补充</summary>

        <div class="row">
          <label class="field">
            <span class="field-label">当前公司</span>
            <input type="text" name="currentCompany" />
          </label>
          <label class="field">
            <span class="field-label">当前职位</span>
            <input type="text" name="currentPosition" />
          </label>
        </div>

        <label class="field">
          <span class="field-label">自我评价</span>
          <textarea name="selfIntro" rows="3"></textarea>
        </label>

        <label class="field">
          <span class="field-label">兴趣爱好 / 特长</span>
          <input type="text" name="hobbies" />
        </label>
      </details>
    </form>

    <footer class="panel-footer">
      <!-- 投递记录：自动登记 + CSV 导出 -->
      <section class="ledger">
        <div class="ledger-head">
          <span class="ledger-title">投递记录</span>
          <span class="ledger-count" id="ledger-count">0 条</span>
          <span class="ledger-actions">
            <button id="btn-export-csv" class="link-btn" type="button">导出 CSV</button>
            <span class="dot">·</span>
            <button id="btn-clear-ledger" class="link-btn danger" type="button">清空</button>
          </span>
        </div>
        <div class="ledger-list" id="ledger-list">加载中…</div>
      </section>

      <div class="btn-group">
        <button id="btn-save" class="btn btn-primary" type="button">保存简历</button>
        <button id="btn-fill" class="btn btn-ghost" type="button">一键填充</button>
      </div>
      <label class="switch-row">
        <input type="checkbox" id="opt-float" />
        <span>在网页右下角显示悬浮按钮</span>
      </label>
      <p class="tip" id="tip">数据仅保存在本浏览器本地，不会上传云端。</p>
      <p class="link-row">
        <button id="btn-demo" class="link-btn" type="button">打开演示页</button>
        <span class="dot">·</span>
        <button id="btn-diag" class="link-btn" type="button">诊断当前页面</button>
        <span class="dot">·</span>
        <button id="btn-preset" class="link-btn" type="button">载入预设简历</button>
      </p>
      <div class="diag-box" id="diag-box"></div>
    </footer>
  </main>

  <script src="field-dictionary.js"></script>
  <script src="site-adapters.js"></script>
  <script src="lib/ledger.js"></script>
  <script src="lib/resume-schema.js"></script>
  <script src="lib/llm-client.js"></script>
  <script src="lib/resume-extract.js"></script>
  <script src="lib/pdf-text.js"></script>
  <!-- pdfjs 是 ESM，只能作为 type="module" 加载；它加载完成后会把自己挂到 window.pdfjsLib -->
  <script type="module" src="lib/pdfjs-boot.js"></script>
  <script src="popup.js"></script>
</body>
</html>
