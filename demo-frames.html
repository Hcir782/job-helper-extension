<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>主文档有表单 + 客服 iframe（京东结构还原）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f6f7; color: #1f2329; padding: 28px 16px 120px; }
    .wrap { max-width: 640px; margin: 0 auto; }
    .banner {
      background: #fff7e6; border: 1px solid #ffd591; border-radius: 8px;
      padding: 10px 14px; font-size: 13px; color: #8a6100; line-height: 1.7; margin-bottom: 18px;
    }
    .card { background: #fff; border-radius: 8px; padding: 22px 26px 26px; }
    h1 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #8f959e; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    .field > label { display: block; font-size: 13px; color: #5d6f80; margin-bottom: 6px; }
    .field input {
      width: 100%; height: 34px; padding: 0 11px; font-size: 14px; font-family: inherit;
      border: 1px solid #d0d3d6; border-radius: 4px; outline: none;
    }
    /* 模拟京东右下角的客服 iframe */
    .cs-frame {
      position: fixed; right: 20px; bottom: 20px; width: 300px; height: 180px;
      border: 1px solid #e3e9f0; border-radius: 10px; background: #fff;
      box-shadow: 0 6px 24px rgba(20, 40, 70, .12);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="banner">
      这个页面复刻京东校招简历页的结构：<b>主文档里是简历表单</b>，右下角挂了一个
      <b>客服 iframe</b>（它只有一个「向我提问」输入框，却会抢在表单前面回话）。
      用来验证插件会不会被这个 iframe 带偏。
    </div>

    <div class="card">
      <h1>我的简历 · 基本信息</h1>
      <p class="sub">主文档（top frame）里的表单，插件应该填这里</p>

      <div class="field">
        <label>姓名</label>
        <input type="text" id="f-name" />
      </div>
      <div class="field">
        <label>手机号码</label>
        <input type="text" id="f-phone" />
      </div>
      <div class="field">
        <label>电子邮箱</label>
        <input type="text" id="f-email" />
      </div>
    </div>
  </div>

  <iframe class="cs-frame" id="cs-frame" src="demo-frames-chat.html" title="京东客服"></iframe>
</body>
</html>
