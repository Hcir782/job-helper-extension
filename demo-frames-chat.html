<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>客服 iframe（只有一个输入框）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #1f2329; background: #fff; padding: 14px 16px;
    }
    .title { font-size: 13px; font-weight: 600; color: #2f6fed; margin-bottom: 8px; }
    .meta { font-size: 12px; color: #8f959e; margin-bottom: 10px; }
    input {
      width: 100%; height: 32px; padding: 0 10px; font-size: 13px; font-family: inherit;
      border: 1px solid #d0d3d6; border-radius: 16px; outline: none;
    }
    .tip { font-size: 12px; color: #8f959e; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="title">京东小助手</div>
  <div class="meta">0/500 投递进展</div>
  <input type="text" id="cs-input" placeholder="向我提问..." />
  <div class="tip">这个输入框不属于简历，插件不应该往里填任何东西。</div>
</body>
</html>
