<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>飞书 atsx 表单 · 求职简历助手演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f5f6f7; color: #1f2329; padding: 32px 16px 80px;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    .banner {
      background: #fff7e6; border: 1px solid #ffd591; border-radius: 8px;
      padding: 10px 14px; font-size: 13px; color: #8a6100; margin-bottom: 18px; line-height: 1.7;
    }
    .card { background: #fff; border-radius: 8px; padding: 24px 28px 30px; }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #8f959e; margin-bottom: 22px; }

    /* ===== 还原飞书 atsx 的栅格 + 表单项结构 ===== */
    .atsx-row { display: flex; align-items: flex-start; margin-bottom: 18px; }
    .atsx-col { position: relative; }
    .atsx-form-item-label {
      flex: 0 0 132px; width: 132px; padding-right: 12px; text-align: right;
      font-size: 14px; color: #1f2329; line-height: 32px;
    }
    .atsx-form-item-label .required { color: #f54a45; margin-right: 4px; }
    .atsx-form-item-control-wrapper { flex: 1; min-width: 0; }
    .atsx-form-item-control { line-height: 32px; }
    .atsx-form-item-children { display: block; }

    .atsx-input {
      width: 100%; height: 32px; padding: 0 11px; font-size: 14px; font-family: inherit;
      color: #1f2329; background: #fff; border: 1px solid #d0d3d6; border-radius: 4px; outline: none;
    }
    .atsx-input:focus { border-color: #3370ff; box-shadow: 0 0 0 2px rgba(51,112,255,.12); }

    /* 飞书 atsx 的 Select：无原生 select，触发器是个 div */
    .atsx-select { position: relative; }
    .atsx-select-selection {
      position: relative; height: 32px; padding: 0 26px 0 11px; font-size: 14px;
      line-height: 30px; background: #fff; border: 1px solid #d0d3d6; border-radius: 4px;
      cursor: pointer; transition: border-color .15s;
    }
    .atsx-select-selection:hover { border-color: #3370ff; }
    .atsx-select-open .atsx-select-selection { border-color: #3370ff; box-shadow: 0 0 0 2px rgba(51,112,255,.12); }
    .atsx-select-selection__rendered { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .atsx-select-selection__placeholder { color: #bbbfc4; }
    .atsx-select-arrow {
      position: absolute; right: 10px; top: 0; line-height: 30px;
      font-size: 10px; color: #8f959e; pointer-events: none;
    }
    /* 浮层：真实组件 appendChild 到 body 末尾 */
    .atsx-select-dropdown {
      position: fixed; z-index: 40; min-width: 200px; max-height: 240px; overflow-y: auto;
      padding: 4px; background: #fff; border-radius: 6px;
      box-shadow: 0 4px 16px rgba(31,35,41,.16); display: none;
    }
    .atsx-select-dropdown ul { list-style: none; }
    .atsx-select-dropdown-menu-item {
      padding: 7px 10px; font-size: 14px; border-radius: 4px; cursor: pointer;
    }
    .atsx-select-dropdown-menu-item:hover,
    .atsx-select-dropdown-menu-item-active { background: #f2f3f5; }
    .atsx-select-dropdown-menu-item-selected { color: #3370ff; font-weight: 600; }

    .actions { margin-top: 8px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .actions > button {
      padding: 8px 20px; font-size: 14px; font-family: inherit; font-weight: 600;
      color: #fff; background: #3370ff; border: none; border-radius: 4px; cursor: pointer;
    }
    .actions > button.ghost { background: #fff; color: #3370ff; border: 1px solid #3370ff; }
    .msg { font-size: 13px; color: #2ea121; line-height: 1.6; }
    .msg.error { color: #f54a45; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="banner">
      这个页面<b>完全按飞书招聘（atsx 组件库）的 DOM 结构还原</b>：字段名写在
      <code>.atsx-form-item-label</code> 里，输入框没有 placeholder，也没有 <code>label[for]</code>；
      下拉是 <code>.atsx-select-selection</code> 这个 div（选项点击后才渲染到 body 末尾）。
      用来验证插件能不能在这类「字段名藏在容器里」的表单上认出字段。
    </div>

    <div class="card">
      <h1>安克创新 · 校园招聘申请表（结构还原）</h1>
      <p class="sub">所有输入框都没有 placeholder —— 只能靠表单项容器里的 label 识别</p>

      <div class="atsx-row atsx-form-item">
        <div class="atsx-col atsx-form-item-label"><label><span class="required">*</span>姓名</label></div>
        <div class="atsx-col atsx-form-item-control-wrapper">
          <div class="atsx-form-item-control">
            <span class="atsx-form-item-children">
              <input class="atsx-input" type="text" id="f-name" />
            </span>
          </div>
        </div>
      </div>

      <div class="atsx-row atsx-form-item">
        <div class="atsx-col atsx-form-item-label"><label><span class="required">*</span>手机号码</label></div>
        <div class="atsx-col atsx-form-item-control-wrapper">
          <div class="atsx-form-item-control">
            <span class="atsx-form-item-children">
              <input class="atsx-input" type="text" id="f-phone" />
            </span>
          </div>
        </div>
      </div>

      <div class="atsx-row atsx-form-item">
        <div class="atsx-col atsx-form-item-label"><label><span class="required">*</span>电子邮箱</label></div>
        <div class="atsx-col atsx-form-item-control-wrapper">
          <div class="atsx-form-item-control">
            <span class="atsx-form-item-children">
              <input class="atsx-input" type="text" id="f-email" />
            </span>
          </div>
        </div>
      </div>

      <div class="atsx-row atsx-form-item">
        <div class="atsx-col atsx-form-item-label"><label><span class="required">*</span>最高学历</label></div>
        <div class="atsx-col atsx-form-item-control-wrapper">
          <div class="atsx-form-item-control">
            <span class="atsx-form-item-children">
              <div class="atsx-select atsx-select-enabled" id="f-education">
                <div class="atsx-select-selection atsx-select-selection--single" role="combobox" aria-haspopup="true" aria-expanded="false">
                  <div class="atsx-select-selection__rendered">
                    <div class="atsx-select-selection__placeholder">请选择</div>
                  </div>
                  <span class="atsx-select-arrow">▾</span>
                </div>
              </div>
            </span>
          </div>
        </div>
      </div>

      <div class="atsx-row atsx-form-item">
        <div class="atsx-col atsx-form-item-label"><label>毕业院校</label></div>
        <div class="atsx-col atsx-form-item-control-wrapper">
          <div class="atsx-form-item-control">
            <span class="atsx-form-item-children">
              <input class="atsx-input" type="text" id="f-school" />
            </span>
          </div>
        </div>
      </div>

      <div class="atsx-row atsx-form-item">
        <div class="atsx-col atsx-form-item-label"><label>所学专业</label></div>
        <div class="atsx-col atsx-form-item-control-wrapper">
          <div class="atsx-form-item-control">
            <span class="atsx-form-item-children">
              <input class="atsx-input" type="text" id="f-major" />
            </span>
          </div>
        </div>
      </div>

      <div class="atsx-row atsx-form-item">
        <div class="atsx-col atsx-form-item-label"><label>政治面貌</label></div>
        <div class="atsx-col atsx-form-item-control-wrapper">
          <div class="atsx-form-item-control">
            <span class="atsx-form-item-children">
              <div class="atsx-select atsx-select-enabled" id="f-politics">
                <div class="atsx-select-selection atsx-select-selection--single" role="combobox" aria-haspopup="true" aria-expanded="false">
                  <div class="atsx-select-selection__rendered">
                    <div class="atsx-select-selection__placeholder">请选择</div>
                  </div>
                  <span class="atsx-select-arrow">▾</span>
                </div>
              </div>
            </span>
          </div>
        </div>
      </div>

      <div class="atsx-row atsx-form-item">
        <div class="atsx-col atsx-form-item-label"><label>期望工作城市</label></div>
        <div class="atsx-col atsx-form-item-control-wrapper">
          <div class="atsx-form-item-control">
            <span class="atsx-form-item-children">
              <div class="atsx-select atsx-select-enabled" id="f-city">
                <div class="atsx-select-selection atsx-select-selection--single" role="combobox" aria-haspopup="true" aria-expanded="false">
                  <div class="atsx-select-selection__rendered">
                    <div class="atsx-select-selection__placeholder">请选择</div>
                  </div>
                  <span class="atsx-select-arrow">▾</span>
                </div>
              </div>
            </span>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="btn-fill-feishu" type="button">用已保存的简历填充</button>
        <button id="btn-reset-feishu" class="ghost" type="button">重置</button>
        <span class="msg" id="feishu-msg"></span>
      </div>
    </div>
  </div>

  <script src="field-dictionary.js"></script>
  <script src="lib/option-match.js"></script>
  <script src="lib/date-value.js"></script>
  <script src="lib/date-group.js"></script>
  <script src="site-adapters.js"></script>
  <script src="content.js"></script>
  <script src="demo-feishu.js"></script>
</body>
</html>
